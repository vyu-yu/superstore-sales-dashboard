name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source data
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("dashboard").resolve()))
          from data_utils import load_data, validate_source_data

          baseline = validate_source_data(load_data())
          assert baseline["rows"] == 9994
          assert baseline["orders"] == 5009
          assert baseline["customers"] == 793
          assert baseline["products"] == 1862
          print("Source data validation passed.")
          PY

      - name: Smoke test dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("dashboard/app.py", default_timeout=60).run()
          assert not app.exception, [item.value for item in app.exception]
          assert len(app.metric) == 4
          assert len(app.get("plotly_chart")) == 8
          print("Dashboard smoke test passed.")
          PY
